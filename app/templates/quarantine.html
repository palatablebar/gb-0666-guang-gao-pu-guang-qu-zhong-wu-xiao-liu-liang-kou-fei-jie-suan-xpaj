{% extends 'base.html' %}
{% block panels %}<section class="panel report-table"><div class="panel__head"><h2>争议记录</h2><input class="filter" type="search" placeholder="筛选记录" aria-label="筛选记录"></div><div class="panel__body flush">{{ ledger(data.quarantine,[('line','来源行'),('code','原因码'),('raw','原始证据')]) }}</div></section><section class="panel distribution"><div class="panel__head"><h2>隔离原因</h2><span>2026 / 11</span></div><div class="panel__body">{% for code,count in data.reason_counts.items() %}<div class="audit-line"><span class="square-status severe">{{ code }}</span><b>{{ count }}</b></div>{% endfor %}</div></section>{% endblock %}
